[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evomerge"
version = "0.2.0"
description = "WasmAgent trace-to-training pipeline and LLM benchmark audit toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "telleroutlook" }]
keywords = [
    "llm", "evaluation", "audit", "mcnemar", "conformal", "reproducibility",
    "sft", "dpo", "ppo", "rlhf", "wasmagent", "compliance", "training-data",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "cryptography>=41.0",
    # Canonical AEP + compliance JSON Schemas. SSOT = WasmAgent/wasmagent-protocol;
    # this repo consumes them via the package and never forks the JSON.
    # 0.1.7 is the first release shipping canonical aep/v0.3 (recording_mode,
    # side_effect_class, run_side_effect_class_max, user_id, subject_id), which
    # evomerge/validate/aep.py consumes via get_schema("aep-record").
    "wasmagent-protocol>=0.1.7",
]

[project.optional-dependencies]
dev    = ["pytest>=8", "ruff>=0.5", "scipy>=1.11", "sympy>=1.12"]
ml     = ["scikit-learn>=1.3", "joblib>=1.3"]
train  = ["scikit-learn>=1.3", "joblib>=1.3", "peft>=0.10", "trl>=0.8", "transformers>=4.40", "bitsandbytes>=0.43"]
# Archival / retrieval layer (Milestone 5, issue #53): enables the genuine
# columnar Parquet codec (evomerge.storage.ParquetCodec). JSONL is the default
# codec and needs no extra deps, so the base/dev install stays dependency-light.
arch   = ["pyarrow>=14.0"]

[project.scripts]
evomerge = "evomerge.__main__:main"
wasmagent-trace = "evomerge.__main__:main"

[project.urls]
Homepage = "https://github.com/WasmAgent/trace-pipeline"
Paper = "https://github.com/WasmAgent/trace-pipeline/blob/main/papers/eval_trust/draft.pdf"

[tool.setuptools.packages.find]
include = ["eval_trust*", "evomerge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E701",   # multiple statements on one line — used intentionally in compact stat tables
    "E402",   # module import not at top — scripts use sys.path.insert before local imports
    "F841",   # local variable assigned but unused — acceptable in scripts
    "E741",   # ambiguous variable name — 'l' in list comprehensions is fine
    "E501",   # line too long — compact stat tables / long f-strings render intentionally wide
]
