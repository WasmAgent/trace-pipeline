name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests + reproducer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout wasmagent-protocol (central conformance corpus)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WasmAgent/wasmagent-protocol
          ref: main
          path: wasmagent-protocol

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          AEP_PROTOCOL_CORPUS: ${{ github.workspace }}/wasmagent-protocol/conformance/aep
        run: PYTHONPATH=. pytest tests/ -q

      - name: Run self-test benchmark (synthetic ground truth)
        run: |
          python benchmarks/self_test.py
          # checks toolkit verdict matches analytical truth on
          # NO_SIGNAL and REAL_SIGNAL synthetic scenarios

      - name: Run reproducer (the case study)
        run: |
          python run_audit.py
          # exits 0 on success; CI fails if reproducer crashes

      - name: Regenerate paper figures from data/
        run: |
          pip install matplotlib
          python papers/eval_trust/scripts/make_figures.py
          # ensures figures are reproducible from data/ alone

      - name: Run all 10 eval_trust examples
        run: |
          for f in examples/recipe{1..10}*.py; do
            echo "--- $f ---"
            python "$f" || exit 1
          done

      - name: Run evomerge pipeline examples (recipe11–16)
        run: |
          for f in examples/recipe1{1..6}*.py; do
            echo "--- $f ---"
            python "$f" || exit 1
          done

      - name: Fixture hash check (golden fixtures must not drift)
        run: |
          python scripts/verify-fixtures-lock.py

      - name: Schema drift check (standalone, no wasmagent-js required)
        run: |
          python scripts/check-schema-fields.py
          # verifies evomerge/schemas/ covers all fields from data-loop contract

      - name: JSON Schema export check (schemas/ must be up to date)
        run: |
          python scripts/export-schemas.py --check
          # fails if schemas/*.schema.json differ from Pydantic model output
          # live parity against wasmagent-js main is checked in nightly.yml

      - name: Schema parity check (runs.jsonl validates against both schemas)
        run: |
          if [ -d "packages/compliance/benchmarks/ifeval" ]; then
            python scripts/check-schema-parity.py \
              --runs-dir packages/compliance/benchmarks/ifeval
          fi

      - name: CLI smoke — export fixture
        run: |
          python -m evomerge export \
            --rollout fixtures/data-loop/rollout-branches.v1.jsonl \
            --out-dir /tmp/evomerge-smoke
          test -f /tmp/evomerge-smoke/manifest.json
          test -f /tmp/evomerge-smoke/sft.jsonl
          test -f /tmp/evomerge-smoke/dpo.jsonl
          test -f /tmp/evomerge-smoke/ppo.jsonl

      - name: CLI smoke — validate exported SFT
        run: |
          python -m evomerge validate \
            --input /tmp/evomerge-smoke/sft.jsonl \
            --strict

      - name: Dataset card smoke (generate + check)
        run: |
          python scripts/generate-dataset-card.py \
            --manifest /tmp/evomerge-smoke/manifest.json \
            --name wasmagent-smoke-v1 \
            --date 2026-06-25 \
            --out /tmp/evomerge-smoke/DATASET_CARD.md
          python scripts/generate-dataset-card.py \
            --manifest /tmp/evomerge-smoke/manifest.json \
            --check

      - name: Lint
        run: |
          ruff check eval_trust/ evomerge/ tests/ run_audit.py \
            papers/eval_trust/scripts/ benchmarks/ examples/ scripts/

  package:
    name: package build + install smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distribution metadata (twine check)
        run: twine check dist/*

      - name: Smoke install from wheel into clean venv
        run: |
          python -m venv /tmp/evomerge-install-test
          /tmp/evomerge-install-test/bin/pip install dist/*.whl
          /tmp/evomerge-install-test/bin/python -c "import evomerge; print('import ok')"
          /tmp/evomerge-install-test/bin/python -m evomerge --help

  paper:
    name: paper builds (pandoc + tectonic)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install matplotlib (needed for figure regen)
        run: pip install matplotlib

      - name: Regenerate figures (paper depends on them)
        run: python papers/eval_trust/scripts/make_figures.py

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy pandoc

      - name: Install tectonic (pinned 0.17.0, checksum-verified)
        run: |
          # Pinned release + SHA-256 verification — no curl | sh.
          # (sha256 of the release tarball, from the GitHub release digest.)
          ART_URL="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          ART_SHA="1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/tectonic.tar.gz "$ART_URL"
          echo "${ART_SHA}  /tmp/tectonic.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/tectonic.tar.gz -C /tmp
          sudo mv /tmp/tectonic /usr/local/bin/

      - name: Build arxiv tar + sanity-compile PDF
        run: bash papers/eval_trust/scripts/prepare_arxiv.sh

      - name: Verify outputs exist
        run: |
          test -f papers/eval_trust/draft.pdf
          test -f papers/eval_trust/arxiv_upload.tar.gz
          ls -lah papers/eval_trust/draft.pdf papers/eval_trust/arxiv_upload.tar.gz

